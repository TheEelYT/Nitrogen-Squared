<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nitrogen Squared</title>
  </head>
  <body data-art="soft">
    <!-- The art never changes: the sharp copy shows on Home, the blurred one everywhere else. -->
    <div id="bg" aria-hidden="true">
      <div class="art art-sharp"></div>
      <div class="art art-soft"></div>
      <div class="scrim scrim-hero"></div>
      <div class="scrim scrim-soft"></div>
    </div>

    <div id="app">
      <nav id="nav" class="glass" aria-label="Main"></nav>
      <main id="view" tabindex="-1"></main>
    </div>

    <div id="titlebar" data-tauri-drag-region>
      <div id="winbtns" role="group" aria-label="Window"></div>
    </div>

    <div id="toast"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>

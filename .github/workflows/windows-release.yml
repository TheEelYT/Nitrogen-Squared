name: Portable Windows launcher
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Package original launcher and portable Python only
        run: |
          python -m unittest discover -s tests -p test_portable.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Portable unit tests failed' }
          python tools/package_source.py --check-tracked --output dist/Nitrogen-Squared-source.zip
          if ($LASTEXITCODE -ne 0) { throw 'Source package audit failed' }
          python tools/package_windows.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows package construction failed' }
      - name: Test extracted launcher and first-run interface
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'Portable Smoke With Spaces'
          Expand-Archive dist/Nitrogen-Squared-Windows-x64.zip $root
          $app = Join-Path $root 'Nitrogen-Squared'
          $report = Join-Path $app '.local/launcher-smoke.json'
          $proc = Start-Process -FilePath "$app/launcher.exe" -ArgumentList @('--self-test', '--report', "`"$report`"") -PassThru
          if (-not $proc.WaitForExit(60000)) {
            taskkill /PID $proc.Id /T /F
            throw 'Portable launcher self-test timed out'
          }
          if ($proc.ExitCode -ne 0) {
            Get-Content "$app/.local/launcher-error.log" -ErrorAction SilentlyContinue
            throw 'Portable launcher self-test failed'
          }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.tkinter -or -not $result.first_run) { throw 'First-run interface was not verified' }
          Write-Output ($result | ConvertTo-Json)
          "NITROGEN_PORTABLE_SMOKE_ROOT=$app" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Test bundled preparation tools against the actual runtime
        shell: pwsh
        run: |
          $app = $env:NITROGEN_PORTABLE_SMOKE_ROOT
          & "$app/support/python/python.exe" -X utf8 -E -s -B "$app/app/tools/portable_launcher.py" --root "$app" --runtime-fixture
          if ($LASTEXITCODE -ne 0) { throw 'Portable compiler/runtime fixture failed' }
          # The tested ZIP was built before any private fixture output existed.
          $expected = (Get-Content dist/Nitrogen-Squared-Windows-x64.zip.sha256).Split(' ')[0]
          $actual = (Get-FileHash dist/Nitrogen-Squared-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Release archive changed during testing' }
      - name: Exercise an actual copied-process update and restart
        shell: pwsh
        run: |
          $app = $env:NITROGEN_PORTABLE_SMOKE_ROOT
          & python tools/test_portable_update_windows.py --root "$app"
          if ($LASTEXITCODE -ne 0) { throw 'Portable updater integration failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: portable-windows-x64
          path: |
            dist/Nitrogen-Squared-Windows-x64.zip
            dist/Nitrogen-Squared-Windows-x64.zip.sha256
            dist/Nitrogen-Squared-source.zip
          if-no-files-found: error
          retention-days: 7
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: portable-windows-x64
          path: dist
      - name: Require the source and cross-platform runtime checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 90); do
            gh api -X GET "repos/$GH_REPO/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=30" > "$RUNNER_TEMP/checks.json"
            if python - "$RUNNER_TEMP/checks.json" <<'PY_GATE'
          import json,sys
          required={'Source checks','Runtime and renderer checks'}
          runs=json.load(open(sys.argv[1]))['workflow_runs']
          states={}
          for run in runs:
              if run['name'] in required and run['name'] not in states: states[run['name']]=run
          if any(r['status']=='completed' and r['conclusion']!='success' for r in states.values()):
              print('A required check failed; release publication is blocked.');sys.exit(1)
          if set(states)==required and all(r['status']=='completed' and r['conclusion']=='success' for r in states.values()):
              print('Required source and Windows/Linux runtime workflows passed.');sys.exit(0)
          sys.exit(3)
          PY_GATE
            then ready=1; break
            else status=$?; if [ "$status" -ne 3 ]; then exit "$status"; fi
            fi
            sleep 20
          done
          if [ "$ready" -ne 1 ]; then echo 'Required checks did not finish in time.'; exit 1; fi
      - name: Publish a complete draft without overwriting a published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          existing=0
          if gh release view "v$version" --json isDraft,targetCommitish > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            existing=1
            if [ "$(python -c "import json;print(json.load(open('$RUNNER_TEMP/existing-release.json'))['isDraft'])")" != True ]; then
              echo "Release v$version is already public; preserving its immutable assets."
              exit 0
            fi
            if [ "$(python -c "import json;print(json.load(open('$RUNNER_TEMP/existing-release.json'))['targetCommitish'])")" != "$GITHUB_SHA" ]; then
              echo 'An unpublished draft belongs to another commit; preserving it for review.'
              exit 1
            fi
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Extract the complete **Nitrogen-Squared** folder and run **launcher.exe**.
          On first launch, select your supported USA N2O **CUE** sheet, keeping its BIN beside it.
          The launcher verifies the disc, downloads pinned preparation tools, compiles your private game, and starts play. No separate Python or Visual Studio installation is required.

          All downloaded, extracted and generated files and saves stay in the extracted folder's `.local` directory. Original disc files remain at the selected location. Keep them available.
          Use the launcher to check for updates. Updates preserve `.local`; the local game is rebuilt when required.

          **Windows 10/11 x64. Internet is required for first preparation and updates.** First compilation may take several minutes. This release contains no commercial game data, generated game code, or prepared game executable.
          NOTES
          if [ "$existing" -eq 0 ]; then
            gh release create "v$version" --draft --target "$GITHUB_SHA" --title "Nitrogen Squared $version — Windows launcher" --notes-file "$RUNNER_TEMP/release-notes.md" dist/Nitrogen-Squared-Windows-x64.zip dist/Nitrogen-Squared-Windows-x64.zip.sha256 dist/Nitrogen-Squared-source.zip
          else
            gh release upload "v$version" --clobber dist/Nitrogen-Squared-Windows-x64.zip dist/Nitrogen-Squared-Windows-x64.zip.sha256 dist/Nitrogen-Squared-source.zip
          fi
          gh release edit "v$version" --draft=false --latest

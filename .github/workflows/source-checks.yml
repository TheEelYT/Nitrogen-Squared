name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Configuration regression prerequisites
        run: |
          cmake --version
          python -m pip install ninja
      - name: Synthetic tests (no game files)
        run: python -m unittest discover -s tests -v
      - name: Reject game content in source package
        run: python tools/package_source.py --check-tracked --output dist/Nitrogen-Squared-source.zip

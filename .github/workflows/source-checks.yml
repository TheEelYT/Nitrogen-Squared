name: Source checks
on:
  push:
    branches: [dev]
  pull_request:
permissions:
  contents: read
jobs:
  source:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Configuration regression prerequisites
        run: |
          cmake --version
          python -m pip install ninja tomli pyyaml
      - name: Synthetic tests (no game files)
        run: python -m unittest discover -s tests -v
      - name: Reject game content in source package
        run: python tools/package_source.py --check-tracked --output dist/Nitrogen-Squared-source.zip
  launcher-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Frontend build and interaction tests
        working-directory: launcher
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:browser
